# Hetzner (or any VPS): app + Postgres + Caddy (automatic HTTPS via Let's Encrypt).
# Usage: cp .env.example .env && edit it, point your domain's A record at the server, then: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Database=foundrmind;Username=foundrmind;Password=${POSTGRES_PASSWORD}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PAGES_TARGET: ${PAGES_TARGET}
      PUBLIC_IP: ${PUBLIC_IP}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE}
    volumes:
      - keys:/data/keys
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: foundrmind
      POSTGRES_USER: foundrmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundrmind"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  keys:
  caddy_data:
